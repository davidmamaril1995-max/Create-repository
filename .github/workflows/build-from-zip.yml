name: Build APK From Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found $ZIP_FILE — extracting..."
            unzip -o "$ZIP_FILE" -d _extracted
          fi

      - name: Locate Gradle project root
        id: locate
        run: |
          ROOT=$(find . -maxdepth 4 -name "settings.gradle.kts" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "Could not find settings.gradle.kts anywhere!"
            find . -maxdepth 4
            exit 1
          fi
          echo "Found project root: $ROOT"
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Prepare Environment
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Build Debug APK with Gradle
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntergalacticStudio-APK
          path: ${{ steps.locate.outputs.project_root }}/app/build/outputs/apk/debug/app-debug.apk
